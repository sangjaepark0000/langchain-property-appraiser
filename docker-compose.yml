services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: langchain_property_appraiser
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d langchain_property_appraiser"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
