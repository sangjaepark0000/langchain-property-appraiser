[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-property-appraiser-backend"
version = "0.1.0"
description = "Backend API for the langchain-property-appraiser RAG application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn[standard]==0.47.0",
  "langchain==1.3.1",
  "langgraph==1.2.0",
  "langchain-openai>=1.2,<2.0",
  "openai>=2.26,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.17,<2.0",
  "pgvector>=0.3,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "langgraph-cli>=0.4,<0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
